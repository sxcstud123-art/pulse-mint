[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
pulsechain = "https://rpc.pulsechain.com"
pulsechain_testnet = "https://rpc.v4.testnet.pulsechain.com"

[lint]
lint_on_build = false

[invariant]
runs = 128
depth = 60
fail_on_revert = false
